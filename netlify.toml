# Netlify configuration for Taj-e-Konain Gas Burner Storefront

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# SPA Single Page App routing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Proxy /api requests to your deployed backend (e.g. Render, Railway, VPS)
