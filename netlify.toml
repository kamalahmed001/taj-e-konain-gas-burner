# Netlify configuration for Taj-e-Konain Gas Burner Storefront

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://taj-e-konain-gas-burner.onrender.com/"

# Proxy /api calls to Render backend (avoids CORS, avoids env var issues)
[[redirects]]
  from = "/api/*"
  to = "https://taj-e-konain-gas-burner.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy /uploads calls to Render backend
[[redirects]]
  from = "/uploads/*"
  to = "https://taj-e-konain-gas-burner.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA Single Page App routing — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
